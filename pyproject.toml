[project]
name = "jarvis"
version = "0.1.0"
description = "Local second jarvis agent with ambient collection"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.22",
    "click>=8.1.0",
    "watchdog>=3.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
semantic = ["semantic-text-chunker>=0.2.0"]

[project.scripts]
jarvis = "jarvis.cli:cli"
jarvis-monitor = "jarvis.monitor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
