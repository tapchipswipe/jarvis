[project]
name = "jarvis"
version = "0.1.0"
description = "Local second jarvis agent with ambient collection"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.22",
    "click>=8.1.0",
    "watchdog>=3.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
semantic = ["semantic-text-chunker>=0.2.0"]

[project.scripts]
jarvis = "jarvis.cli:cli"
jarvis-monitor = "jarvis.monitor:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
